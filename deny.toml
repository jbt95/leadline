# cargo-deny configuration for leadline.
#
# Deny-by-default licensing: the transitive closure is MIT and Apache-2.0,
# which also covers criterion's dev-only graph (alloca, plotters, clap,
# regex). Two crates need an extra allowance: unicode-ident adds Unicode-3.0
# and zerocopy / zerocopy-derive add BSD-2-Clause. The BurntSushi crates are
# dual-licensed `Unlicense OR MIT`, which `Unlicense` alone no longer needs to
# cover. Anything else, including copyleft and unknown licenses, fails
# `cargo deny check licenses`. Re-check the allow list with
# `cargo deny check licenses` after any dependency change: new versions pull
# new transitive crates, and the list above is a policy, not an enumeration
# that stays accurate on its own.

[graph]
# Target triples must be an explicit array (cargo-deny has no "all"
# shorthand). Keep this in sync with the release workflow matrix.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerability, unsound, and notice advisories always fail in current
# cargo-deny; only the unmaintained scope stays configurable.
# `unmaintained` takes a scope (all/workspace/transitive/none), not a lint
# level: fail only when one of our own direct dependencies is unmaintained.
unmaintained = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Deny-by-default: anything not in `allow` fails, which covers the removed
# `unlicensed`, `copyleft`, and `allow-osi-fsf-free` keys.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
