[package]
name = "leadline"
version = "0.14.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Fast function-level complexity analysis for Go, Java, JavaScript, TypeScript, and TSX"
readme = "README.md"
documentation = "https://docs.rs/leadline"
repository = "https://github.com/jbt95/leadline"
keywords = ["complexity", "static-analysis", "java", "typescript", "crap"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".agents/**", ".github/**", "AGENTS.md", "docs/superpowers/**", "skills-lock.json"]

[dependencies]
blake3 = "1.8.7"
ignore = "0.4"
quick-xml = "0.42"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.27"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "analyzer"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "duplication"
harness = false

[[bench]]
name = "source_snapshot"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "realworld"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
