# Workspace manifest.
#
# The root is a virtual manifest: it declares the members, the package metadata
# every crate inherits, the shared dependency versions, and the build profiles
# (`[profile]` is only accepted at the workspace root). There is no `[package]`
# here, so installing with `--path .` is not valid any more; the binary crate
# lives in `crates/leadline` and installs with `cargo install --path
# crates/leadline`.
#
# Nothing in this workspace is published. Releases ship prebuilt binaries
# through `install.sh` and the GitHub release, so the crates carry no
# `documentation`, `exclude`, or registry-facing metadata, and the crate names
# do not need to be free on crates.io.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
repository = "https://github.com/jbt95/leadline"

[workspace.dependencies]
blake3 = "1.8.7"
ignore = "0.4"
quick-xml = "0.42"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.27"
tree-sitter-c = "0.24.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25"
tree-sitter-cpp = "0.23.4"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
criterion = "0.8"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo bench` inherits release by default, which strips symbols from the
# bench binaries and serializes codegen for no gain: profiling a Criterion
# run needs symbols, and the benches are measured in bulk.
[profile.bench]
lto = false
codegen-units = 256
debug = true
strip = false
