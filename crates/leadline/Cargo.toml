[package]
name = "leadline"
description = "Fast function-level complexity analysis for C, C++, Go, Java, JavaScript, Python, Rust, TypeScript, TSX, and Zig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["complexity", "static-analysis", "java", "typescript", "crap"]
categories = ["command-line-utilities", "development-tools"]

# `main.rs` is the whole crate: it drives the other crates and serializes
# their output, so `serde`/`serde_json` are its only external dependencies.
# Everything else it names comes from a path dependency.
[dependencies]
analysis = { path = "../analysis" }
artifacts = { path = "../artifacts" }
codegraph = { path = "../codegraph" }
config = { path = "../config" }
git = { path = "../git" }
model = { path = "../model" }
parse = { path = "../parse" }
report = { path = "../report" }
serde.workspace = true
serde_json.workspace = true
surfaces = { path = "../surfaces" }
update = { path = "../update" }
