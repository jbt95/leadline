[package]
name = "tia"
description = "Test impact analysis: select the tests a change can affect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The readers test impact analysis needs, and only those: `parse` for the
# parser and the coverage and test-map readers, `model` and `config` for the
# shapes and the run settings, `codegraph` for churn, `analysis` for the graph
# and the test targets, `artifacts` for the recorded test evidence. `report`,
# `surfaces`, `update`, and `leadline` sit above this crate and stay out:
# aggregation, the MCP and HTTP surfaces, and the self-updater are not inputs
# to a selection.
[dependencies]
analysis = { path = "../analysis" }
artifacts = { path = "../artifacts" }
codegraph = { path = "../codegraph" }
config = { path = "../config" }
model = { path = "../model" }
parse = { path = "../parse" }
