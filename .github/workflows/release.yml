name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.16.0
        required: true
        type: string

permissions:
  contents: read

env:
  # The tag this run releases: the dispatch input, or the pushed tag. Using
  # github.event.inputs (not inputs) keeps the expression null-safe when the
  # workflow is triggered by a push.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ env.RELEASE_TAG }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: leadline-aarch64-apple-darwin.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: leadline-x86_64-apple-darwin.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: leadline-aarch64-unknown-linux-gnu.tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: leadline-x86_64-unknown-linux-gnu.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: leadline-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} leadline
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/leadline.exe -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./
          format: cyclonedx-json
          syft-version: v1.51.1
          output-file: dist/leadline.cyclonedx.json
          upload-artifact: false
      - name: Check the tag shape
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "release tag must look like vX.Y.Z, got: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
      - name: Write VERSION
        run: echo "$RELEASE_TAG" > dist/VERSION
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" dist/* --clobber; then
              break
            fi
            echo "upload attempt $i failed, retrying..."
            sleep $((i * 10))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
