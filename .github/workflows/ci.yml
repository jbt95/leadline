name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly supply-chain recheck against newly published advisories.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        shell: bash
        run: bash scripts/ci-install-rust.sh minimum
      - name: Install lint tools
        if: matrix.runner == 'ubuntu-24.04'
        run: rustup component add clippy rustfmt
      - name: Check formatting
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --check
      - name: Lint
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Compile benchmarks
        if: matrix.runner == 'ubuntu-24.04'
        # Every declared bench, not a subset: a type error in one the analyzer
        # job does not reach would otherwise pass the whole pull request.
        run: cargo bench --no-run --locked
      - name: Build release binary
        run: cargo build --release --locked

  msrv:
    name: Rust 1.90 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust 1.90
        shell: bash
        run: bash scripts/ci-install-rust.sh exact
      - run: rustup run 1.90 cargo check --locked

  supply-chain:
    name: Supply chain (audit + deny)
    runs-on: ubuntu-24.04
    # Scheduled runs report newly published advisories without failing
    # on network flakiness; pull request and push runs are strict.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        shell: bash
        run: bash scripts/ci-install-rust.sh minimum
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  ts-check:
    name: Typecheck TS adapters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned typecheck deps
        working-directory: integrations/agent-adapter-ts
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: integrations/agent-adapter-ts
        run: npm run check

  opencode-v2-check:
    name: Typecheck OpenCode V2 plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # This is the package the root `exports` points at, so it is what a
      # consumer of `leadline/server` actually loads. The check deps are local:
      # the host that loads the entry point resolves `@opencode/plugin` itself.
      - name: Install plugin deps
        working-directory: integrations/opencode/plugin-v2
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: integrations/opencode/plugin-v2
        run: npm run check

  triage-checks:
    name: Triage companion checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned lint and typecheck deps
        working-directory: integrations/typesafe-triage
        run: npm ci --no-audit --no-fund
      - name: Typecheck and lint (anti-slop)
        working-directory: integrations/typesafe-triage
        run: npm run check
      - name: Test
        working-directory: integrations/typesafe-triage
        run: npm test
